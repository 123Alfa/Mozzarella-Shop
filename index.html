<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a5f2a">
<title>بيت الموتزاريلا - النظام المتقدم</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --primary:#14532d;
  --primary-dark:#0b3b20;
  --primary-light:#22a06b;
  --accent:#e6a817;

  --danger:#dc3545;
  --success:#16a34a;
  --info:#2563eb;
  --warning:#f59e0b;

  --bg:#f3f6f4;
  --card:#ffffff;

  --text:#17251d;
  --text-light:#6b7a70;
  --border:#dfe7e1;

  --shadow:0 8px 25px rgba(20,83,45,0.08);
  --radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:
  "Tahoma",
  "Arial",
  sans-serif;

  background:
  linear-gradient(
    180deg,
    #eaf3ed 0,
    #f5f7f6 280px,
    #f3f6f4 100%
  );

  color:var(--text);
  line-height:1.6;
  min-height:100vh;
}
#loading-screen{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,var(--primary),var(--primary-light));display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;transition:opacity 0.5s}
#loading-screen.hidden{opacity:0;pointer-events:none}
.loading-logo{font-size:4rem;margin-bottom:20px;animation:bounce 1.5s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.loading-text{font-size:1.3rem;font-weight:600;margin-bottom:20px}
.loading-bar{width:200px;height:4px;background:rgba(255,255,255,0.3);border-radius:2px;overflow:hidden}
.loading-bar-inner{height:100%;width:0%;background:white;border-radius:2px;animation:loadBar 2s ease forwards}
@keyframes loadBar{to{width:100%}}
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 50%,var(--accent) 100%);padding:20px}
.auth-card{background:white;border-radius:var(--radius);padding:35px 30px;width:100%;max-width:420px;box-shadow:0 8px 30px rgba(0,0,0,0.12);animation:slideUp 0.5s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.auth-logo{text-align:center;margin-bottom:25px}
.auth-logo .icon{font-size:3.5rem;margin-bottom:10px}
.auth-logo h1{font-size:1.5rem;color:var(--primary)}
.auth-logo p{color:var(--text-light);font-size:0.9rem;margin-top:5px}
.auth-tabs{display:flex;gap:0;margin-bottom:25px;border-radius:8px;overflow:hidden;border:2px solid var(--border)}
.auth-tab{flex:1;padding:12px;border:none;background:white;cursor:pointer;font-weight:600;font-size:0.95rem}
.auth-tab.active{background:var(--primary);color:white}
.auth-form .form-group{margin-bottom:18px}
.auth-form label{display:block;margin-bottom:6px;font-weight:600;font-size:0.85rem;color:#555}
.auth-form input{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:8px;font-size:1rem}
.auth-form input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,95,42,0.1)}
.btn-auth{width:100%;padding:15px;border:none;border-radius:8px;background:var(--primary);color:white;font-size:1rem;font-weight:700;cursor:pointer;margin-top:10px}
.btn-auth:disabled{opacity:0.6}
.auth-error{background:#fee;color:var(--danger);padding:12px;border-radius:8px;margin-bottom:15px;font-size:0.9rem;display:none}
#app{display:none;min-height:100vh}
.app-header{
  background:
  linear-gradient(
    135deg,
    var(--primary-dark),
    var(--primary)
  );

  color:white;

  padding:
  18px 18px 22px;

  position:sticky;
  top:0;

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:space-between;

  box-shadow:
  0 5px 22px
  rgba(11,59,32,.22);

  border-radius:
  0 0 25px 25px;
}
..app-header h1{
  font-size:1.12rem;

  display:flex;
  align-items:center;

  gap:10px;

  font-weight:800;

  letter-spacing:
  -.3px;
}
.user-info{display:flex;align-items:center;gap:12px}
.user-avatar{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-weight:700}
.logout-btn{background:rgba(255,255,255,0.15);border:none;color:white;padding:8px 14px;border-radius:8px;cursor:pointer}
..bottom-nav{
  position:fixed;

  bottom:0;
  left:0;
  right:0;

  z-index:100;

  background:
  rgba(255,255,255,.96);

  display:flex;

  justify-content:
  space-around;

  padding:
  8px 6px
  calc(
  10px +
  env(
  safe-area-inset-bottom
  ));

  box-shadow:
  0 -8px 30px
  rgba(20,83,45,.10);

  border-top:
  1px solid
  rgba(20,83,45,.08);

  backdrop-filter:
  blur(15px);
}
.bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border:none;background:none;color:var(--text-light);font-size:0.7rem;cursor:pointer}
.bottom-nav-item i{font-size:1.3rem}
..bottom-nav-item.active{
  color:var(--primary);

  background:
  #e8f5ed;

  border-radius:
  15px;

  font-weight:
  800;
}
.content-area{padding:15px 15px 90px;max-width:900px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:1.05rem;color:var(--primary);margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:10px;font-weight:700}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:18px 12px;text-align:center;box-shadow:var(--shadow);border-top:3px solid var(--primary)}
.stat-card.danger{border-top-color:var(--danger)}
.stat-card.accent{border-top-color:var(--accent)}
.stat-card.success{border-top-color:var(--success)}
.stat-value{font-size:1.3rem;font-weight:800;color:var(--primary);margin:6px 0}
.stat-card.danger .stat-value{color:var(--danger)}
.stat-card.accent .stat-value{color:var(--accent)}
.stat-card.success .stat-value{color:var(--success)}
.stat-label{font-size:0.75rem;color:var(--text-light);font-weight:600}
.form-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:16px}
@media(min-width:600px){.form-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.form-grid{grid-template-columns:repeat(3,1fr)}}
.form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:0.82rem;color:#555}
.form-group input,.form-group select{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:8px;font-size:1rem;font-family:inherit}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,95,42,0.08)}
.form-group input[readonly]{background:#f8f9f8}
.profit-input{background:#e8f5e9 !important;color:var(--success) !important;font-weight:700 !important}
.btn{padding:14px 28px;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--primary);color:white}
.btn-danger{background:var(--danger);color:white}
.btn-accent{background:var(--accent);color:#2c3e50}
.btn-success{background:var(--success);color:white}
.btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary)}
.btn-sm{padding:8px 14px;font-size:0.8rem}
.btn-block{width:100%}
.btn:disabled{opacity:0.5}
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:0.88rem}
th,td{padding:12px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:#f8faf8;font-weight:700;color:var(--primary);font-size:0.78rem}
.badge{padding:4px 10px;border-radius:20px;font-size:0.72rem;font-weight:700;display:inline-block}
.badge-cheese{background:#fff3cd;color:#856404}
.badge-frozen{background:#d1ecf1;color:#0c5460}
.badge-debt{background:#f8d7da;color:#721c24}
.badge-paid{background:#d4edda;color:#155724}
.search-box{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search-box input{flex:1;min-width:180px;padding:12px 16px;border:2px solid var(--border);border-radius:8px}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-light)}
.empty-state i{font-size:3rem;margin-bottom:15px;opacity:0.4}
.summary-box{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:white;border-radius:var(--radius);padding:25px 18px;margin-bottom:16px;position:relative;overflow:hidden}
.summary-box::before{content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 60%)}
.summary-box h2{text-align:center;margin-bottom:20px;font-size:1.2rem;position:relative;z-index:1}
.summary-grid{display:grid;grid-template-columns:1fr;gap:10px;position:relative;z-index:1}
@media(min-width:600px){.summary-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.summary-grid{grid-template-columns:repeat(4,1fr)}}
.summary-item{background:rgba(255,255,255,0.12);border-radius:8px;padding:16px 12px;text-align:center;border:1px solid rgba(255,255,255,0.1)}
.summary-item h3{font-size:0.8rem;opacity:0.85;margin-bottom:6px}
.summary-item .amount{font-size:1.2rem;font-weight:800}
.summary-item.highlight{background:rgba(255,215,0,0.2);border:1px solid rgba(255,215,0,0.3)}
.chart-container{position:relative;height:280px;margin:20px 0}
.quick-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.quick-action{background:var(--card);border-radius:var(--radius);padding:18px 12px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer}
.quick-action i{font-size:1.8rem;color:var(--primary);margin-bottom:8px;display:block}
.quick-action span{font-size:0.85rem;font-weight:600}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:600px){.product-grid{grid-template-columns:repeat(3,1fr)}}
.product-item{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;position:relative}
.product-item .p-icon{font-size:2rem;margin-bottom:8px}
.product-item .p-name{font-weight:700;font-size:0.9rem;margin-bottom:4px}
.product-item .p-type{font-size:0.75rem;color:var(--text-light);margin-bottom:8px}
.product-item .p-price{font-size:1.1rem;font-weight:800;color:var(--primary)}
.product-item .p-qty{font-size:0.8rem;color:var(--text-light)}
.product-item .p-profit{font-size:0.8rem;color:var(--success);font-weight:600;margin-top:4px}
.debt-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border-right:4px solid var(--danger);display:flex;justify-content:space-between;align-items:center}
.debt-card.paid{border-right-color:var(--success);opacity:0.7}
.debt-card .debt-person{font-weight:700;font-size:0.95rem}
.debt-card .debt-meta{font-size:0.8rem;color:var(--text-light);margin-top:4px}
.debt-card .debt-amount{font-size:1.2rem;font-weight:800;color:var(--danger)}
.debt-card.paid .debt-amount{color:var(--success)}
.modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.5);display:none;justify-content:center;align-items:flex-end;backdrop-filter:blur(3px)}
.modal-overlay.active{display:flex}
.modal{background:white;border-radius:var(--radius) var(--radius) 0 0;padding:25px 20px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;animation:slideUp 0.3s ease}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-header h2{color:var(--primary);font-size:1.2rem}
.modal-close{background:none;border:none;font-size:1.5rem;color:var(--text-light);cursor:pointer}
.toast-container{position:fixed;top:70px;left:15px;right:15px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--text);color:white;padding:14px 18px;border-radius:8px;font-size:0.9rem;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;animation:toastIn 0.3s ease;pointer-events:auto}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.warning{background:var(--warning)}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.sync-status{position:fixed;top:70px;left:15px;z-index:150;background:var(--success);color:white;padding:8px 14px;border-radius:20px;font-size:0.75rem;font-weight:700;display:flex;align-items:center;gap:6px;opacity:0;transition:opacity 0.3s}
.sync-status.show{opacity:1}
.fade-in{animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media print{.bottom-nav,.app-header,.no-print,.btn{display:none !important}.content-area{padding:20px}.card{box-shadow:none;border:1px solid #ddd}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@media(max-width:400px){.stats-grid{grid-template-columns:repeat(2,1fr);gap:8px}.stat-value{font-size:1.1rem}}
</style>

  <meta name="apple-mobile-web-app-title" content="بيت الموتزاريلا">

<body>

<div id="loading-screen">
  <div class="loading-logo">🧀</div>
  <div class="loading-text">جاري تحميل النظام...</div>
  <div class="loading-bar"><div class="loading-bar-inner"></div></div>
</div>

<div id="auth-screen" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="icon">🧀</div>
      <h1>بيت الموتزاريلا</h1>
      <p>نظام إدارة متكامل للجبن والمجمدات</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuth('login')">تسجيل الدخول</button>
      <button class="auth-tab" onclick="switchAuth('register')">حساب جديد</button>
    </div>
    <div class="auth-error" id="authError"></div>
    <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group"><label>📧 البريد الإلكتروني</label><input type="email" id="loginEmail" placeholder="example@email.com" required></div>
      <div class="form-group"><label>🔒 كلمة المرور</label><input type="password" id="loginPassword" placeholder="••••••••" required></div>
      <button type="submit" class="btn-auth" id="loginBtn">تسجيل الدخول</button>
    </form>
    <form class="auth-form" id="registerForm" style="display:none" onsubmit="handleRegister(event)">
      <div class="form-group"><label>👤 الاسم الكامل</label><input type="text" id="regName" placeholder="محمد أحمد" required></div>
      <div class="form-group"><label>📧 البريد الإلكتروني</label><input type="email" id="regEmail" placeholder="example@email.com" required></div>
      <div class="form-group"><label>🔒 كلمة المرور</label><input type="password" id="regPassword" placeholder="8 أحرف على الأقل" minlength="8" required></div>
      <div class="form-group"><label>💰 رأس المال الافتتاحي (ج.م)</label><input type="number" id="regCapital" placeholder="0.00" step="0.01"></div>
      <button type="submit" class="btn-auth" id="regBtn">إنشاء الحساب</button>
    </form>
    <div class="auth-footer"><p>🔒 البيانات محمية ومتزامنة في السحابة</p></div>
  </div>
</div>

<div id="app">
  <header class="app-header">
    <h1>
  <span
  style="
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.18);
  border-radius:14px;
  ">
  🧀
  </span>

  <span>
  بيت الموتزاريلا
  <small
  style="
  display:block;
  font-size:.65rem;
  font-weight:400;
  opacity:.75;
  margin-top:1px;
  ">
  المبيعات والمخزون
  </small>
  </span>
</h1>
    <div class="user-info">
      <span id="userName" style="font-size:0.85rem"></span>
      <div class="user-avatar" id="userAvatar">👤</div>
      <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </header>
  <div class="sync-status" id="syncStatus"><i class="fas fa-check-circle"></i> متزامن</div>
  <div class="content-area" id="contentArea"></div>
  <nav class="bottom-nav">
    <button class="bottom-nav-item active" onclick="navigateTo('dashboard')"><i class="fas fa-chart-pie"></i><span>الرئيسية</span></button>
    <button class="bottom-nav-item" onclick="navigateTo('products')"><i class="fas fa-cheese"></i><span>الأصناف</span></button>
    <button class="bottom-nav-item" onclick="navigateTo('sales')"><i class="fas fa-shopping-cart"></i><span>المبيعات</span></button>
    <button class="bottom-nav-item" onclick="navigateTo('more')"><i class="fas fa-ellipsis-h"></i><span>المزيد</span></button>
  </nav>
</div>

<div class="toast-container" id="toastContainer"></div>
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const Store={
  get(key){return JSON.parse(localStorage.getItem('bm_'+key)||'[]')},
  set(key,val){localStorage.setItem('bm_'+key,JSON.stringify(val))},
  add(key,data){const arr=this.get(key);data.id=Date.now().toString(36)+Math.random().toString(36).substr(2,5);data.createdAt=new Date().toISOString();arr.push(data);this.set(key,arr);return data},
  update(key,id,data){const arr=this.get(key);const i=arr.findIndex(x=>x.id===id);if(i>=0){arr[i]={...arr[i],...data};this.set(key,arr)}},
  delete(key,id){this.set(key,this.get(key).filter(x=>x.id!==id))},
  getUser(){return JSON.parse(localStorage.getItem('bm_user')||'null')},
  setUser(u){localStorage.setItem('bm_user',JSON.stringify(u))},
  clear(){['products','sales','purchases','expenses','withdrawals','debts','user'].forEach(k=>localStorage.removeItem('bm_'+k))}
};

let currentUser=null;
let currentTab='dashboard';

function switchAuth(type){
  document.querySelectorAll('.auth-tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('loginForm').style.display=type==='login'?'block':'none';
  document.getElementById('registerForm').style.display=type==='register'?'block':'none';
  document.getElementById('authError').style.display='none';
}

function handleLogin(e){
  e.preventDefault();
  const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='جاري...';
  const email=document.getElementById('loginEmail').value;
  const user=Store.getUser();
  if(user&&user.email===email){currentUser=user;showApp();}
  else{document.getElementById('authError').textContent='البريد غير مسجل. أنشئ حساب جديد.';document.getElementById('authError').style.display='block';}
  btn.disabled=false;btn.textContent='تسجيل الدخول';
}

function handleRegister(e){
  e.preventDefault();
  const btn=document.getElementById('regBtn');btn.disabled=true;btn.textContent='جاري...';
  currentUser={
    name:document.getElementById('regName').value,
    email:document.getElementById('regEmail').value,
    capital:parseFloat(document.getElementById('regCapital').value)||0,
    createdAt:new Date().toISOString()
  };
  Store.setUser(currentUser);
  showApp();
  btn.disabled=false;btn.textContent='إنشاء الحساب';
}

function showAuthScreen(){
  document.getElementById('loading-screen').classList.add('hidden');
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('app').style.display='none';
}

function showApp(){
  document.getElementById('loading-screen').classList.add('hidden');
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('userName').textContent=currentUser?.name||'مستخدم';
  document.getElementById('userAvatar').textContent=(currentUser?.name||'م')[0];
  navigateTo('dashboard');
}

function logout(){
  if(confirm('تسجيل الخروج؟')){currentUser=null;showAuthScreen();}
}

function navigateTo(tab){
  currentTab=tab;
  document.querySelectorAll('.bottom-nav-item').forEach(b=>b.classList.remove('active'));
  const tabs={dashboard:0,products:1,sales:2,more:3};
  document.querySelectorAll('.bottom-nav-item')[tabs[tab]||0]?.classList.add('active');
  const content=document.getElementById('contentArea');content.innerHTML='';
  switch(tab){
    case 'dashboard':renderDashboardPage(content);break;
    case 'products':renderProductsPage(content);break;
    case 'sales':renderSalesPage(content);break;
    case 'more':renderMorePage(content);break;
    case 'purchases':renderPurchasesPage(content);break;
    case 'expenses':renderExpensesPage(content);break;
    case 'withdrawals':renderWithdrawalsPage(content);break;
    case 'debts':renderDebtsPage(content);break;
    case 'summary':renderSummaryPage(content);break;
    case 'reports':renderReportsPage(content);break;
  }
}

function renderDashboardPage(container){
  const products=Store.get('products');
  const sales=Store.get('sales');
  const debts=Store.get('debts');
  const todayStr=today();
  const todaySales=sales.filter(s=>s.date===todayStr);
  const todayTotal=todaySales.reduce((sum,s)=>sum+(s.total||0),0);
  const todayProfit=todaySales.reduce((sum,s)=>sum+(s.profit||0),0);
  const activeDebts=debts.filter(d=>!d.paid&&d.type==='لنا').reduce((sum,d)=>sum+(d.amount||0),0);
  
  container.innerHTML=`<div class=\"fade-in\">
    <div class=\"stats-grid\">
      <div class=\"stat-card\" onclick=\"navigateTo('sales')\"><div class=\"stat-label\">💰 مبيعات اليوم</div><div class=\"stat-value\">${fmt(todayTotal)}</div></div>
      <div class=\"stat-card accent\" onclick=\"navigateTo('sales')\"><div class=\"stat-label\">📈 صافي المكسب</div><div class=\"stat-value\">${fmt(todayProfit)}</div></div>
      <div class=\"stat-card danger\" onclick=\"navigateTo('debts')\"><div class=\"stat-label\">📋 ديون مستحقة</div><div class=\"stat-value\">${fmt(activeDebts)}</div></div>
      <div class=\"stat-card success\" onclick=\"navigateTo('products')\"><div class=\"stat-label\">📦 عدد الأصناف</div><div class=\"stat-value\">${products.length}</div></div>
    </div>
    <div class=\"quick-actions\">
      <div class=\"quick-action\" onclick=\"navigateTo('sales')\"><i class=\"fas fa-shopping-cart\"></i><span>بيع سريع</span></div>
      <div class=\"quick-action\" onclick=\"navigateTo('expenses')\"><i class=\"fas fa-wallet\"></i><span>مصروف</span></div>
      <div class=\"quick-action\" onclick=\"navigateTo('purchases')\"><i class=\"fas fa-truck\"></i><span>شراء</span></div>
      <div class=\"quick-action\" onclick=\"navigateTo('summary')\"><i class=\"fas fa-file-invoice-dollar\"></i><span>ملخص الشهر</span></div>
    </div>
    <div class=\"card\">
      <div class=\"card-title\"><i class=\"fas fa-chart-line\"></i> المبيعات الأسبوعية</div>
      <div class=\"chart-container\"><canvas id=\"weekChart\"></canvas></div>
    </div>
    <div class=\"card\">
      <div class=\"card-title\"><i class=\"fas fa-clock\"></i> آخر العمليات</div>
      <div class=\"table-wrap\">
        <table><thead><tr><th>الوقت</th><th>النوع</th><th>التفاصيل</th><th>المبلغ</th></tr></thead>
        <tbody id=\"recentActivity\"></tbody></table>
      </div>
    </div>
  </div>`;
  
  renderWeekChart(sales);
  const all=[...sales.map(s=>({...s,kind:'بيع',icon:'🛒',time:s.date})),...debts.filter(d=>!d.paid).map(d=>({...d,kind:'دين',icon:'📋',time:d.date,total:d.amount}))].sort((a,b)=>(b.time>a.time?1:-1)).slice(0,8);
  document.getElementById('recentActivity').innerHTML=all.map(a=>`<tr><td>${a.time}</td><td>${a.icon} ${a.kind}</td><td>${a.productName||a.person||'-'}</td><td style=\"font-weight:bold\">${fmt(a.total||0)}</td></tr>`).join('')||'<tr><td colspan=\"4\" class=\"empty\">لا توجد عمليات</td></tr>';
}

function renderWeekChart(sales){
  const ctx=document.getElementById('weekChart');if(!ctx)return;
  const days=[],data=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=d.toISOString().split('T')[0];
    days.push(d.toLocaleDateString('ar-EG',{weekday:'short'}));
    data.push(sales.filter(s=>s.date===ds).reduce((sum,s)=>sum+(s.total||0),0));
  }
  new Chart(ctx,{type:'bar',data:{labels:days,datasets:[{label:'المبيعات',data,backgroundColor:'rgba(26,95,42,0.7)',borderColor:'#1a5f2a',borderWidth:1,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'rgba(0,0,0,0.05)'}}}}});
}

      <div id="productsGrid" class="product-grid"></div>

function filterProducts(){
  const search=document.getElementById('productSearch')?.value.toLowerCase()||'';
  const products=(window.allProducts||[]).filter(p=>p.name.toLowerCase().includes(search));
  document.getElementById('productsGrid').innerHTML=products.map(p=>{
    const profit=(p.retail||0)-(p.purchase||p.wholesale||0);
    const pct=p.wholesale>0?((profit/p.wholesale)*100).toFixed(0):0;
    const icon=p.type==='cheese'?'🧀':'❄️';
    const lowStock=(p.qty||0)<5?'<div style="color:var(--danger);font-size:0.75rem;font-weight:700">⚠️ مخزون منخفض</div>':'';
    return `<div class="product-item" onclick="editProduct('${p.id}')">
      <div class="p-icon">${icon}</div>
      <div class="p-name">${p.name}</div>
      <div class="p-type"><span class="badge badge-${p.type}">${p.type==='cheese'?'جبن':'مجمدات'}</span></div>
      <div class="p-price">${fmt(p.retail||0)}</div>
      <div class="p-qty">المخزون: ${p.qty||0} ${p.unit||'كجم'}</div>
      <div class="p-profit">💰 مكسب: ${fmt(profit)} (${pct}%)</div>
      ${lowStock}
      <div style="margin-top:8px;display:flex;gap:6px">
        <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button>
      </div>
    </div>`;
  }).join('')||'<div class="empty-state"><i class="fas fa-cheese"></i><p>لا يوجد أصناف. أضف صنف جديد!</p></div>';
}

function addProduct(){
  const name=document.getElementById('pName').value.trim();
  if(!name)return showToast('أدخل اسم الصنف','warning');
  Store.add('products',{name,type:document.getElementById('pType').value,purchase:parseFloat(document.getElementById('pPurchase').value)||0,wholesale:parseFloat(document.getElementById('pWholesale').value)||0,retail:parseFloat(document.getElementById('pRetail').value)||0,qty:parseFloat(document.getElementById('pQty').value)||0,unit:document.getElementById('pUnit').value});
  showToast('✅ تم الإضافة');
  document.getElementById('pName').value='';document.getElementById('pPurchase').value='';document.getElementById('pWholesale').value='';document.getElementById('pRetail').value='';document.getElementById('pQty').value='';
  renderProductsPage(document.getElementById('contentArea'));
}

function deleteProduct(id){
  if(!confirm('حذف الصنف؟'))return;
  Store.delete('products',id);showToast('🗑️ تم الحذف');
  renderProductsPage(document.getElementById('contentArea'));
}

function editProduct(id){
  const p=(window.allProducts||[]).find(x=>x.id===id);if(!p)return;
  openModal(`<div class="modal-header"><h2>✏️ تعديل ${p.name}</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="form-grid">
      <div class="form-group"><label>الاسم</label><input id="epName" value="${p.name}"></div>
      <div class="form-group"><label>النوع</label><select id="epType"><option value="cheese" ${p.type==='cheese'?'selected':''}>جبن</option><option value="frozen" ${p.type==='frozen'?'selected':''}>مجمدات</option></select></div>
      <div class="form-group"><label>سعر الشراء</label><input type="number" id="epPurchase" value="${p.purchase||p.wholesale||0}" step="0.01"></div>
       <div class="form-group"><label>الجملة</label><input type="number" id="epWholesale" value="${p.wholesale||0}" step="0.01"></div>
      <div class="form-group"><label>القطاعي</label><input type="number" id="epRetail" value="${p.retail||0}" step="0.01"></div>
      <div class="form-group"><label>الكمية</label><input type="number" id="epQty" value="${p.qty||0}" step="0.01"></div>
      <div class="form-group"><label>الوحدة</label><select id="epUnit"><option ${p.unit==='كجم'?'selected':''}>كجم</option><option ${p.unit==='علبة'?'selected':''}>علبة</option><option ${p.unit==='قطعة'?'selected':''}>قطعة</option><option ${p.unit==='كرتونة'?'selected':''}>كرتونة</option></select></div>
    </div>
    <button class="btn btn-primary btn-block" onclick="saveProductEdit('${id}')">💾 حفظ التعديلات</button>`);
}

function saveProductEdit(id){
  Store.update('products',id,{name:document.getElementById('epName').value,type:document.getElementById('epType').value,purchase:parseFloat(document.getElementById('epPurchase').value)||0,wholesale:parseFloat(document.getElementById('epWholesale').value)||0,retail:parseFloat(document.getElementById('epRetail').value)||0,qty:parseFloat(document.getElementById('epQty').value)||0,unit:document.getElementById('epUnit').value});
  closeModal();showToast('✅ تم التعديل');
  renderProductsPage(document.getElementById('contentArea'));
}

function renderSalesPage(container){
  const products=Store.get('products');
  window.saleProducts=products;
  const opts=products.map(p=>`<option value="${p.id}" data-wholesale="${p.wholesale}" data-retail="${p.retail}" data-qty="${p.qty}">${p.name} (${p.qty} ${p.unit})</option>`).join('');
  container.innerHTML=`<div class="fade-in">
    <div class="card">
      <div class="card-title"><i class="fas fa-shopping-cart"></i> تسجيل مبيعات</div>
      <div class="form-grid">
        <div class="form-group"><label>التاريخ</label><input type="date" id="sDate" value="${today()}"></div>
        <div class="form-group"><label>الصنف</label><select id="sProduct" onchange="updateSalePrice()">${opts}</select></div>
        <div class="form-group"><label>نوع البيع</label><select id="sType" onchange="updateSalePrice()"><option value="retail">🛍️ قطاعي</option><option value="wholesale">📦 جملة</option></select></div>
        <div class="form-group"><label>الكمية</label><input type="number" id="sQty" placeholder="0" step="0.01" oninput="calcSaleProfit()"></div>
        <div class="form-group"><label>سعر البيع</label><input type="number" id="sPrice" placeholder="0.00" step="0.01" oninput="calcSaleProfit()"></div>
        <div class="form-group"><label>التكلفة</label><input type="number" id="sCost" placeholder="0.00" step="0.01" readonly style="background:#f5f5f5"></div>
        <div class="form-group"><label>المكسب المتوقع</label><input type="number" id="sProfit" class="profit-input" placeholder="0.00" step="0.01" readonly></div>
        <div class="form-group"><label>ملاحظات</label><input type="text" id="sNote" placeholder="اختياري"></div>
      </div>
      <button class="btn btn-primary btn-block" onclick="addSale()"><i class="fas fa-check"></i> تأكيد البيع</button>
    </div>
    <div class="card">
      <div class="card-title"><i class="fas fa-history"></i> سجل المبيعات</div>
      <div class="search-box"><input type="date" id="saleFilterDate" onchange="renderSalesTable()"><input type="text" id="saleSearch" placeholder="ابحث..." oninput="renderSalesTable()"></div>
      <div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الصنف</th><th>النوع</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th>المكسب</th><th>إجراء</th></tr></thead><tbody id="salesTable"></tbody></table></div>
    </div>
  </div>`;
  if(products.length>0)updateSalePrice();
  renderSalesTable();
}

function updateSalePrice(){
  const select=document.getElementById('sProduct');const option=select?.options[select.selectedIndex];if(!option)return;
  const type=document.getElementById('sType').value;
  const price=type==='wholesale'?parseFloat(option.dataset.wholesale):parseFloat(option.dataset.retail);
  document.getElementById('sPrice').value=price||'';
  const product=(window.saleProducts||[]).find(p=>p.id===option.value);
  document.getElementById('sCost').value=(product?.purchase??option.dataset.wholesale)||'';
  calcSaleProfit();
}

function calcSaleProfit(){
  const price=parseFloat(document.getElementById('sPrice').value)||0;
  const cost=parseFloat(document.getElementById('sCost').value)||0;
  const qty=parseFloat(document.getElementById('sQty').value)||0;
  document.getElementById('sProfit').value=((price-cost)*qty).toFixed(2);
}

function addSale(){
  const pid=document.getElementById('sProduct').value;
  const qty=parseFloat(document.getElementById('sQty').value)||0;
  const price=parseFloat(document.getElementById('sPrice').value)||0;
  const cost=parseFloat(document.getElementById('sCost').value)||0;
  if(!pid||qty<=0||price<=0)return showToast('أكمل البيانات','warning');
  const product=(window.saleProducts||[]).find(p=>p.id===pid);
  if(!product)return;
  if((product.qty||0)<qty)return showToast('الكمية غير متوفرة! المتاح: '+product.qty+' '+product.unit,'warning');
  Store.update('products',pid,{qty:(product.qty||0)-qty});
  const profit=(price-cost)*qty;
  Store.add('sales',{date:document.getElementById('sDate').value||today(),productId:pid,productName:product.name,type:document.getElementById('sType').value,qty,price,cost,total:price*qty,profit,note:document.getElementById('sNote').value});
  showToast('✅ تم البيع: '+fmt(price*qty));
  document.getElementById('sQty').value='';document.getElementById('sNote').value='';calcSaleProfit();
  renderSalesPage(document.getElementById('contentArea'));
}

function renderSalesTable(){
  const sales=Store.get('sales');
  const fd=document.getElementById('saleFilterDate')?.value||'';
  const fs=document.getElementById('saleSearch')?.value.toLowerCase()||'';
  const filtered=sales.filter(s=>(!fd||s.date===fd)&&((s.productName||'').toLowerCase().includes(fs)||(s.note||'').toLowerCase().includes(fs)));
  document.getElementById('salesTable').innerHTML=filtered.map(s=>`<tr><td>${s.date}</td><td>${s.productName}</td><td><span class="badge badge-${s.type}">${s.type==='retail'?'قطاعي':'جملة'}</span></td><td>${s.qty}</td><td>${fmt(s.price)}</td><td>${fmt(s.total)}</td><td style="color:var(--success);font-weight:bold">${fmt(s.profit)}</td><td><button class="btn btn-sm btn-danger" onclick="deleteSale('${s.id}','${s.productId}',${s.qty})"><i class="fas fa-trash"></i></button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">لا يوجد مبيعات</td></tr>';
}

function deleteSale(id,productId,qty){
  if(!confirm('حذف عملية البيع؟'))return;
  if(productId){const p=Store.get('products').find(x=>x.id===productId);if(p)Store.update('products',productId,{qty:(p.qty||0)+qty});}
  Store.delete('sales',id);showToast('🗑️ تم الحذف');renderSalesTable();
}

function renderPurchasesPage(container){
  const products=Store.get('products');
  const opts=products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  container.innerHTML=`<div class="fade-in">
    <div class="card">
      <div class="card-title"><i class="fas fa-truck-loading"></i> تسجيل مشتريات</div>
      <div class="form-grid">
        <div class="form-group"><label>التاريخ</label><input type="date" id="purDate" value="${today()}"></div>
        <div class="form-group"><label>الصنف</label><select id="purProduct">${opts}</select></div>
        <div class="form-group"><label>الكمية</label><input type="number" id="purQty" placeholder="0" step="0.01"></div>
        <div class="form-group"><label>سعر الشراء</label><input type="number" id="purPrice" placeholder="0.00" step="0.01"></div>
        <div class="form-group"><label>المورد</label><input type="text" id="purSupplier" placeholder="اسم المورد"></div>

    <div class="card">
      <div class="card-title"><i class="fas fa-history"></i> سجل المشتريات</div>
      <div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th>المورد</th><th>إجراء</th></tr></thead><tbody id="purchasesTable"></tbody></table></div>
    </div>

function addPurchase(){
  const pid=document.getElementById('purProduct').value;
  const qty=parseFloat(document.getElementById('purQty').value)||0;
  const price=parseFloat(document.getElementById('purPrice').value)||0;
  if(!pid||qty<=0||price<=0)return showToast('أكمل البيانات','warning');
  const products=Store.get('products');
  const product=products.find(p=>p.id===pid);if(!product)return;
  Store.update('products',pid,{qty:(product.qty||0)+qty,purchase:price,wholesale:price});
  Store.add('purchases',{date:document.getElementById('purDate').value||today(),productId:pid,productName:product.name,qty,price,total:price*qty,supplier:document.getElementById('purSupplier').value,note:document.getElementById('purNote').value});
  showToast('✅ تم الشراء: '+fmt(price*qty));
  document.getElementById('purQty').value='';document.getElementById('purPrice').value='';document.getElementById('purSupplier').value='';document.getElementById('purNote').value='';
  renderPurchasesPage(document.getElementById('contentArea'));
}

function renderPurchasesTable(){
  const purchases=Store.get('purchases');
  document.getElementById('purchasesTable').innerHTML=purchases.map(p=>`<tr><td>${p.date}</td><td>${p.productName}</td><td>${p.qty}</td><td>${fmt(p.price)}</td><td>${fmt(p.total)}</td><td>${p.supplier||'-'}</td><td><button class="btn btn-sm btn-danger" onclick="deletePurchase('${p.id}')"><i class="fas fa-trash"></i></button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">لا يوجد مشتريات</td></tr>';
}

function deletePurchase(id){if(!confirm('حذف؟'))return;Store.delete('purchases',id);showToast('🗑️ تم الحذف');renderPurchasesTable();}

function renderExpensesPage(container){
  container.innerHTML=`<div class="fade-in">
    <div class="card">
      <div class="card-title"><i class="fas fa-file-invoice-dollar"></i> تسجيل مصروف</div>

        <div class="form-group" style="display:flex;align-items:flex-end"><button class="btn btn-accent btn-block" onclick="window.print()"><i class="fas fa-print"></i> طباعة</button></div>

        <div class="stat-card"><div class="stat-label">متوسط الفاتورة</div><div class="stat-value" id="sumAvgSale">0 ج.م</div></div>
        <div class="stat-card"><div class="stat-label">نسبة الربح</div><div class="stat-value" id="sumProfitPercent">0%</div></div>
        <div class="stat-card"><div class="stat-label">أعلى صنف</div><div class="stat-value" id="sumTopProduct" style="font-size:0.85rem">-</div></div>
      </div>
    </div>

function loadSummary(){
  const month=document.getElementById('summaryMonth')?.value||today().slice(0,7);
  const sales=Store.get('sales');
  const purchases=Store.get('purchases');
  const expenses=Store.get('expenses');
  const withdrawals=Store.get('withdrawals');
  const debts=Store.get('debts');
  const products=Store.get('products');
  
  const inMonth=d=>d.startsWith(month);
  const mSales=sales.filter(s=>inMonth(s.date));
  const mPurchases=purchases.filter(p=>inMonth(p.date));
  const mExpenses=expenses.filter(e=>inMonth(e.date));
  const mWithdrawals=withdrawals.filter(w=>inMonth(w.date));
  const mDebts=debts.filter(d=>inMonth(d.date));
  
  const totalSales=mSales.reduce((sum,s)=>sum+(s.total||0),0);
  const totalProfit=mSales.reduce((sum,s)=>sum+(s.profit||0),0);
  const totalPurchases=mPurchases.reduce((sum,p)=>sum+(p.total||0),0);
  const totalExpenses=mExpenses.reduce((sum,e)=>sum+(e.amount||0),0);
  const totalWithdrawals=mWithdrawals.reduce((sum,w)=>sum+(w.amount||0),0);
  
  const debtsOnUs=mDebts.filter(d=>d.type==='علينا'&&!d.paid).reduce((sum,d)=>sum+(d.amount||0),0);
  const debtsForUs=mDebts.filter(d=>d.type==='لنا'&&!d.paid).reduce((sum,d)=>sum+(d.amount||0),0);
  const netDebts=debtsForUs-debtsOnUs;
  
  const inventoryValue=products.reduce((sum,p)=>sum+((p.qty||0)*(p.wholesale||0)),0);
  const capital=(currentUser?.capital||0)||totalPurchases+inventoryValue;
  const netProfit=totalProfit-totalExpenses-totalWithdrawals;
  
  document.getElementById('sumCapital').textContent=fmt(capital);
  document.getElementById('sumInventory').textContent=fmt(inventoryValue);
  document.getElementById('sumSales').textContent=fmt(totalSales);
  document.getElementById('sumPurchases').textContent=fmt(totalPurchases);
  document.getElementById('sumExpenses').textContent=fmt(totalExpenses);
  document.getElementById('sumWithdrawals').textContent=fmt(totalWithdrawals);
  document.getElementById('sumDebts').textContent=(netDebts>=0?'+':'')+fmt(netDebts);
  document.getElementById('sumNetProfit').textContent=fmt(netProfit);
  document.getElementById('sumNetProfit').style.color=netProfit>=0?'#ffd700':'#ff6b6b';
  
  document.getElementById('sumSaleCount').textContent=mSales.length;
  document.getElementById('sumAvgSale').textContent=fmt(mSales.length?totalSales/mSales.length:0);
  document.getElementById('sumProfitPercent').textContent=totalSales>0?((totalProfit/totalSales)*100).toFixed(1)+'%':'0%';
  
  const ps={};
  mSales.forEach(s=>{ps[s.productName]=(ps[s.productName]||0)+(s.total||0)});
  const top=Object.entries(ps).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('sumTopProduct').textContent=top?top[0]:'-';
}

function renderReportsPage(container){
  container.innerHTML=`<div class="fade-in">
    <div class="card">
      <div class="card-title"><i class="fas fa-chart-line"></i> تحليل المبيعات</div>
      <div class="chart-container"><canvas id="salesChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title"><i class="fas fa-chart-pie"></i> توزيع المصروفات</div>
      <div class="chart-container"><canvas id="expenseChart"></canvas></div>
    </div>
  </div>`;
  
  const sales=Store.get('sales');
  const expenses=Store.get('expenses');
  
  const monthly={};
  sales.forEach(s=>{const m=s.date?.slice(0,7)||'unknown';monthly[m]=(monthly[m]||0)+(s.total||0)});
  
  new Chart(document.getElementById('salesChart'),{
    type:'line',
    data:{labels:Object.keys(monthly).sort(),datasets:[{label:'المبيعات الشهرية',data:Object.keys(monthly).sort().map(k=>monthly[k]),borderColor:'#1a5f2a',backgroundColor:'rgba(26,95,42,0.1)',fill:true,tension:0.4}]},
    options:{responsive:true,maintainAspectRatio:false}
  });
  
  const byType={};
  expenses.forEach(e=>{byType[e.type]=(byType[e.type]||0)+(e.amount||0)});
  
  new Chart(document.getElementById('expenseChart'),{
    type:'doughnut',
    data:{labels:Object.keys(byType),datasets:[{data:Object.values(byType),backgroundColor:['#1a5f2a','#2e8b4e','#d4a017','#c0392b','#2980b9','#8e44ad','#27ae60']}]},
    options:{responsive:true,maintainAspectRatio:false}
  });
}

function exportData(){
  const data={products:Store.get('products'),sales:Store.get('sales'),purchases:Store.get('purchases'),expenses:Store.get('expenses'),withdrawals:Store.get('withdrawals'),debts:Store.get('debts'),userData:currentUser,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='mozzarella_backup_'+today()+'.json';a.click();URL.revokeObjectURL(url);
  showToast('✅ تم التصدير');
}

function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const data=JSON.parse(e.target.result);
    if(!confirm('سيتم استبدال جميع البيانات. متأكد؟'))return;
    ['products','sales','purchases','expenses','withdrawals','debts'].forEach(k=>Store.set(k,data[k]||[]));
    if(data.userData)Store.setUser(data.userData);
    showToast('✅ تم الاستيراد');navigateTo('dashboard');
  };
  reader.readAsText(file);
}

function clearAllData(){
  if(!confirm('⚠️ سيتم حذف ALL البيانات! متأكد؟'))return;
  if(!confirm('تأكيد نهائي: مسح كل البيانات؟'))return;
  Store.clear();showToast('🗑️ تم المسح');navigateTo('dashboard');
}

function openModal(content){
  document.getElementById('modalContent').innerHTML=content;
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('active');
}

function showToast(message,type='success'){
  const container=document.getElementById('toastContainer');
  const toast=document.createElement('div');
  toast.className='toast '+type;
  toast.innerHTML=`<i class="fas fa-${type==='success'?'check-circle':type==='error'?'exclamation-circle':'exclamation-triangle'}"></i> ${message}`;
  container.appendChild(toast);
  setTimeout(()=>{toast.style.animation='toastOut 0.3s ease';setTimeout(()=>toast.remove(),300)},3000);
}

function fmt(n){
  return Number(n||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';
}

function today(){
  return new Date().toISOString().split('T')[0];
}

window.addEventListener('DOMContentLoaded',()=>{
  setTimeout(()=>{
    const user=Store.getUser();
    if(user){currentUser=user;showApp();}
    else{showAuthScreen();}
  },1500);
});
</script>
